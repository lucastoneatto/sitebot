# Proyecto "Compose" en Dokploy para sitebot. Dokploy clona el repo, escribe un .env al lado de este
# archivo a partir de las variables que cargues en su panel, y corre esto. Se expone agregando dominios
# desde la UI de Dokploy, uno por servicio ("sitebot-api" puerto 3001, "sitebot-web" puerto 3000) —
# Traefik hace el resto.
#
# Los nombres de servicio llevan el prefijo "sitebot-" (en vez de "api"/"db"/etc genéricos) porque
# Dokploy conecta TODOS los proyectos a una misma red compartida ("dokploy-network") para que Traefik
# pueda rutear. En esa red, el alias DNS de un servicio es literalmente su nombre — con nombres
# genéricos, dos proyectos con un servicio "api" colisionan y el DNS interno de Docker responde con
# cualquiera de los dos contenedores de forma intermitente (visto en producción: sitebot-web resolviendo
# "api" a veces pegaba contra el api de docubot). Ver deploy/dokploy/README.md § Trampas conocidas.
name: sitebot

services:
  sitebot-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  sitebot-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    restart: unless-stopped
    command:
      # Sin proactor_threads, Dragonfly asume 1 thread por core del host, y en VPS
      # chicas eso pide más RAM de la que hay. Fijo bajo porque el volumen de esta
      # cola es chico. allow-undeclared-keys es obligatorio: los scripts Lua de
      # BullMQ acceden claves no declaradas en KEYS[] (Redis clásico no lo exige).
      - --proactor_threads=2
      - --default_lua_flags=allow-undeclared-keys
    ulimits:
      memlock: -1
    volumes:
      - dragonflydata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sitebot-api:
    build:
      context: ../../api
    restart: unless-stopped
    # Corre las migraciones pendientes antes de levantar el server, en cada
    # arranque/rebuild — db:migrate es idempotente (drizzle lleva registro de
    # las ya aplicadas), así que no hace falta correrlas a mano en el VPS.
    command: sh -c "pnpm db:migrate && node dist/main.js"
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}@sitebot-db:5432/bot
      REDIS_URL: redis://sitebot-dragonfly:6379
      API_PORT: 3001
      API_URL: ${API_URL:?Falta API_URL}
      CORS_RELAXED: "false"
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:?Falta DASHBOARD_ORIGINS}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Falta OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://api.openai.com/v1}
      CHAT_RELATIVE_MARGIN: ${CHAT_RELATIVE_MARGIN:-0.02}
      ADMIN_USER: ${ADMIN_USER:?Falta ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
      BULL_BOARD_USER: ${BULL_BOARD_USER:?Falta BULL_BOARD_USER}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:?Falta BULL_BOARD_PASSWORD}
      CRAWL_PAGE_CONCURRENCY: ${CRAWL_PAGE_CONCURRENCY:-8}
      CRAWL_RENDER_JS: ${CRAWL_RENDER_JS:-true}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-20}
      CRAWL_MAX_DEPTH: ${CRAWL_MAX_DEPTH:-2}
      CRAWL_ALLOW_PRIVATE: ${CRAWL_ALLOW_PRIVATE:-false}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-180}
      PRICE_CHAT_INPUT_PER_M: ${PRICE_CHAT_INPUT_PER_M:-0.15}
      PRICE_CHAT_OUTPUT_PER_M: ${PRICE_CHAT_OUTPUT_PER_M:-0.60}
      PRICE_EMBEDDING_PER_M: ${PRICE_EMBEDDING_PER_M:-0.02}
    depends_on:
      sitebot-db:
        condition: service_healthy
      sitebot-dragonfly:
        condition: service_healthy
    volumes:
      # Cache del modelo de embeddings local (Xenova/transformers.js): sin esto se
      # re-descarga en cada deploy/restart.
      - modelcache:/root/.cache/huggingface
    expose:
      - "3001"

  sitebot-web:
    build:
      context: ../../web
      args:
        # NEXT_PUBLIC_API_URL se inlinea en el build (ver web/Dockerfile): cambiarla
        # exige Rebuild en Dokploy, no alcanza con reiniciar el contenedor.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Falta NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      API_URL: http://sitebot-api:3001
      ADMIN_USER: ${ADMIN_USER:?Falta ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD}
    depends_on:
      - sitebot-api
    expose:
      - "3000"

volumes:
  pgdata:
  modelcache:
  dragonflydata:
